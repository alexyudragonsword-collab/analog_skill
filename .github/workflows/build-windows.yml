name: Build Windows executables

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/gmoverid-skill-analysis-7ron1c']
    paths:
      - 'app/**'
      - 'gmoverid/**'
      - 'ngspice/**'
      - 'requirements*.txt'
      - 'app.spec'
      - '.github/workflows/build-windows.yml'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Variant 1: PyInstaller (onedir, uses the repo's app.spec)
  # ───────────────────────────────────────────────────────────────────────────
  pyinstaller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller app.spec --noconfirm

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          # windowed (console=False) exe: PowerShell does not wait for GUI
          # subsystem binaries, so use Start-Process -Wait to get the exit code
          $p = Start-Process -FilePath ".\dist\AnalogStudio\AnalogStudio.exe" `
                             -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\AnalogStudio -DestinationPath AnalogStudio-windows-pyinstaller.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-windows-pyinstaller
          path: AnalogStudio-windows-pyinstaller.zip
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Diagnostic spikes: isolate the Windows-only access violation seen when
  # the Nuitka-built app executes `import scipy.stats`. Three minimal
  # console-mode binaries partition the failure space: numpy alone,
  # scipy alone, and Qt-then-scipy (the app's import order).
  # Remove this job once the nuitka smoke test is green.
  # ───────────────────────────────────────────────────────────────────────────
  nuitka-spike:
    runs-on: windows-latest
    env:
      PYTHONFAULTHANDLER: 1
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy PySide6 "nuitka>=2.8,<3"

      - name: Restore Nuitka compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-spike-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-

      - name: Spike 1 — numpy only
        shell: pwsh
        run: |
          Set-Content spike1.py "import numpy; print('numpy', numpy.__version__, 'OK')"
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --output-dir=s1 spike1.py
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $site -Directory -Filter '*.libs' |
            ForEach-Object { Get-ChildItem "$($_.FullName)\*.dll" | Copy-Item -Force -Destination s1\spike1.dist }
          & .\s1\spike1.dist\spike1.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "spike1 (numpy) failed: $LASTEXITCODE"; exit 1 }

      - name: Spike 2 — scipy.stats + scipy.signal
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Set-Content spike2.py "import scipy.stats, scipy.signal; print('scipy OK')"
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --output-dir=s2 spike2.py
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $site -Directory -Filter '*.libs' |
            ForEach-Object { Get-ChildItem "$($_.FullName)\*.dll" | Copy-Item -Force -Destination s2\spike2.dist }
          & .\s2\spike2.dist\spike2.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "spike2 (scipy) failed: $LASTEXITCODE"; exit 1 }

      - name: Spike 3 — QApplication then scipy (app's order)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          @'
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          import scipy.stats
          import scipy.signal
          print('qt-then-scipy OK')
          '@ -replace '(?m)^          ', '' | Set-Content spike3.py
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --enable-plugin=pyside6 --output-dir=s3 spike3.py
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $site -Directory -Filter '*.libs' |
            ForEach-Object { Get-ChildItem "$($_.FullName)\*.dll" | Copy-Item -Force -Destination s3\spike3.dist }
          & .\s3\spike3.dist\spike3.exe
          if ($LASTEXITCODE -ne 0) { Write-Error "spike3 (qt+scipy) failed: $LASTEXITCODE"; exit 1 }

      - name: Save Nuitka compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-spike-${{ github.run_id }}

  # ───────────────────────────────────────────────────────────────────────────
  # Variant 2: Nuitka (standalone, compiled to C)
  # ───────────────────────────────────────────────────────────────────────────
  nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # restore/save split so the compilation cache is saved even when a later
      # step (smoke test) fails — otherwise every debug iteration recompiles
      # all ~900 C files from scratch (~45 min)
      - name: Restore Nuitka compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        shell: pwsh
        # The skill asset trees are NOT passed via --include-data-dir:
        # Nuitka refuses to ship .py files as data, and the trees are pure
        # runtime source (imported from the synced workspace via sys.path).
        # They are copied into the dist verbatim in the next step instead.
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --msvc=latest `
            --enable-plugin=pyside6 `
            --include-module=PySide6.QtSvg `
            --include-module=matplotlib.backends.backend_agg `
            --include-module=matplotlib.backends.backend_qtagg `
            --include-module=scipy.stats `
            --include-module=scipy.signal `
            --include-package-data=matplotlib `
            --include-data-dir=app/resources=app_resources `
            --include-data-dir=transistor-models/assets/models/bulk_cmos=bulk_models `
            --windows-console-mode=disable `
            --force-stderr-spec="{PROGRAM_BASE}.err.txt" `
            --force-stdout-spec="{PROGRAM_BASE}.out.txt" `
            --output-filename=AnalogStudio.exe `
            --output-dir=build-nuitka `
            app/main.py

      - name: Save Nuitka compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}

      - name: Bundle skill assets + wheel DLLs
        shell: pwsh
        # app/paths.py looks for <exe dir>/skill/{ngspice_assets,gmoverid_assets}
        # and syncs them to a writable per-user workspace on first launch.
        #
        # The *.libs dirs (numpy.libs, scipy.libs) hold the delvewheel-bundled
        # OpenBLAS DLLs.  Nuitka's DLL scan misses them (they are found via
        # os.add_dll_directory at runtime, not the import table search path),
        # and without them `import scipy` segfaults at startup — they must sit
        # next to the package dirs in the dist, where the delvewheel patch in
        # numpy/__init__.py resolves `<pkg>/../numpy.libs`.
        run: |
          $dist = "build-nuitka\main.dist"
          New-Item -ItemType Directory -Force -Path "$dist\skill" | Out-Null
          Copy-Item -Recurse ngspice\assets  "$dist\skill\ngspice_assets"
          Copy-Item -Recurse gmoverid\assets "$dist\skill\gmoverid_assets"
          Get-ChildItem -Recurse "$dist\skill" -Include __pycache__,logs,plots -Directory |
            Remove-Item -Recurse -Force
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $site -Directory -Filter '*.libs' | ForEach-Object {
            Write-Host "Bundling wheel DLL dir: $($_.Name)"
            Copy-Item -Recurse -Force $_.FullName "$dist\$($_.Name)"
            # ...and flatten the DLLs into the exe dir: the application
            # directory is always on the Windows DLL search path, whereas
            # os.add_dll_directory (what the delvewheel patch uses to expose
            # the *.libs dir) is not honoured by Nuitka's module loader
            Get-ChildItem "$($_.FullName)\*.dll" | Copy-Item -Force -Destination $dist
          }
          Rename-Item "$dist" "AnalogStudio"

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          # crashes then dump a Python traceback into AnalogStudio.err.txt,
          # which the failure step below prints
          PYTHONFAULTHANDLER: 1
          # stage-by-stage startup trace from app/paths.py, same destination
          ANALOG_STUDIO_TRACE: 1
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build-nuitka\AnalogStudio\AnalogStudio.exe" `
                             -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Dump app output on failure
        if: failure()
        shell: pwsh
        # the windowed exe writes stdout/stderr to *.txt via --force-std*-spec;
        # print them so crashes show their traceback in the CI log
        run: |
          Get-ChildItem build-nuitka\AnalogStudio\AnalogStudio.*.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_ }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build-nuitka\AnalogStudio -DestinationPath AnalogStudio-windows-nuitka.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-windows-nuitka
          path: AnalogStudio-windows-nuitka.zip
          if-no-files-found: error
