name: Build executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Also publish a GitHub Release under this tag (e.g.
          v1.1) with the packages built by this run; empty = build only.
          Useful where direct tag pushes are not permitted.'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
    branches: ['claude/gmoverid-skill-analysis-7ron1c']
    paths:
      - 'app/**'
      - 'gmoverid/**'
      - 'ngspice/**'
      - 'transistor-models/**'
      - 'analoggym/**'
      - 'studio_circuits/**'
      - 'requirements*.txt'
      - 'app.spec'
      - '.github/workflows/build-windows.yml'
      - '.github/actions/**'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Variant 1: PyInstaller (onedir, uses the repo's app.spec)
  # ───────────────────────────────────────────────────────────────────────────
  pyinstaller:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # best-effort: build a win64 bsimcmg.osdi so FinFET works out of the box;
      # never fails the build (FinFET just stays disabled on Windows if it can't)
      - name: Compile FinFET OSDI (Windows)
        continue-on-error: true
        uses: ./.github/actions/finfet-osdi-windows

      - name: Build with PyInstaller
        run: pyinstaller app.spec --noconfirm

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          # windowed (console=False) exe: PowerShell does not wait for GUI
          # subsystem binaries, so use Start-Process -Wait to get the exit code
          $p = Start-Process -FilePath ".\dist\AnalogStudio\AnalogStudio.exe" `
                             -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\AnalogStudio -DestinationPath AnalogStudio-windows-pyinstaller.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-windows-pyinstaller
          path: AnalogStudio-windows-pyinstaller.zip
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Variant 2: Nuitka (standalone, compiled to C)
  # ───────────────────────────────────────────────────────────────────────────
  nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # restore/save split so the compilation cache is saved even when a later
      # step (smoke test) fails — otherwise every debug iteration recompiles
      # all ~900 C files from scratch (~45 min)
      - name: Restore Nuitka compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-

      # best-effort: build a win64 bsimcmg.osdi so FinFET works out of the box;
      # never fails the build (FinFET just stays disabled on Windows if it can't)
      - name: Compile FinFET OSDI (Windows)
        continue-on-error: true
        uses: ./.github/actions/finfet-osdi-windows

      - name: Build with Nuitka
        shell: pwsh
        # The skill asset trees are NOT passed via --include-data-dir:
        # Nuitka refuses to ship .py files as data, and the trees are pure
        # runtime source (imported from the synced workspace via sys.path).
        # They are copied into the dist verbatim in the next step instead.
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --msvc=latest `
            --enable-plugin=pyside6 `
            --include-package=app `
            --include-module=PySide6.QtSvg `
            --include-module=matplotlib.backends.backend_agg `
            --include-module=matplotlib.backends.backend_qtagg `
            --include-module=scipy.stats `
            --include-module=scipy.signal `
            --nofollow-import-to=optuna `
            --nofollow-import-to=sqlalchemy `
            --nofollow-import-to=greenlet `
            --nofollow-import-to=alembic `
            --nofollow-import-to=mako `
            --nofollow-import-to=colorlog `
            --include-package-data=matplotlib `
            --include-data-dir=app/resources=app_resources `
            --include-data-dir=transistor-models/assets/models/bulk_cmos=bulk_models `
            --include-data-dir=transistor-models/assets/models/finfet=finfet_models `
            --include-data-dir=analoggym=analoggym `
            --include-data-dir=studio_circuits=studio_circuits `
            --windows-console-mode=disable `
            --windows-icon-from-ico=app/resources/icons/app_icon.ico `
            --force-stderr-spec="{PROGRAM_BASE}.err.txt" `
            --force-stdout-spec="{PROGRAM_BASE}.out.txt" `
            --output-filename=AnalogStudio.exe `
            --output-dir=build-nuitka `
            app/main.py

      - name: Save Nuitka compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}

      - name: Bundle skill assets + wheel DLLs
        shell: pwsh
        # app/paths.py looks for <exe dir>/skill/{ngspice_assets,gmoverid_assets}
        # and syncs them to a writable per-user workspace on first launch.
        #
        # The *.libs dirs (numpy.libs, scipy.libs) hold the delvewheel-bundled
        # OpenBLAS DLLs.  Nuitka's DLL scan misses them (they are found via
        # os.add_dll_directory at runtime, not the import table search path),
        # and without them `import scipy` segfaults at startup — they must sit
        # next to the package dirs in the dist, where the delvewheel patch in
        # numpy/__init__.py resolves `<pkg>/../numpy.libs`.
        run: |
          $dist = "build-nuitka\main.dist"
          New-Item -ItemType Directory -Force -Path "$dist\skill" | Out-Null
          Copy-Item -Recurse ngspice\assets  "$dist\skill\ngspice_assets"
          Copy-Item -Recurse gmoverid\assets "$dist\skill\gmoverid_assets"
          # circuit-skills contain .py (Nuitka refuses those as data) — copy verbatim
          Copy-Item -Recurse circuit-skills "$dist\circuit_skills"
          Get-ChildItem -Recurse "$dist\skill","$dist\circuit_skills" -Include __pycache__,logs,plots -Directory |
            Remove-Item -Recurse -Force
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          Get-ChildItem -Path $site -Directory -Filter '*.libs' | ForEach-Object {
            Write-Host "Bundling wheel DLL dir: $($_.Name)"
            Copy-Item -Recurse -Force $_.FullName "$dist\$($_.Name)"
            # ...and flatten the DLLs into the exe dir: the application
            # directory is always on the Windows DLL search path, whereas
            # os.add_dll_directory (what the delvewheel patch uses to expose
            # the *.libs dir) is not honoured by Nuitka's module loader
            Get-ChildItem "$($_.FullName)\*.dll" | Copy-Item -Force -Destination $dist
          }
          Rename-Item "$dist" "AnalogStudio"

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          # crashes then dump a Python traceback into AnalogStudio.err.txt,
          # which the failure step below prints
          PYTHONFAULTHANDLER: 1
          # stage-by-stage startup trace from app/paths.py, same destination
          ANALOG_STUDIO_TRACE: 1
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build-nuitka\AnalogStudio\AnalogStudio.exe" `
                             -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Dump app output on failure
        if: failure()
        shell: pwsh
        # the windowed exe writes stdout/stderr to *.txt via --force-std*-spec;
        # print them so crashes show their traceback in the CI log
        run: |
          Get-ChildItem build-nuitka\AnalogStudio\AnalogStudio.*.txt -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_ }

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path build-nuitka\AnalogStudio -DestinationPath AnalogStudio-windows-nuitka.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-windows-nuitka
          path: AnalogStudio-windows-nuitka.zip
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Variant 3: Linux (PyInstaller onedir, same app.spec — it is cross-platform:
  # the Qt trim matches both .so and .dll names and the linux64 bsimcmg.osdi
  # is already vendored in the finfet model tree)
  # ───────────────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Build with PyInstaller
        run: pyinstaller app.spec --noconfirm

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 180 ./dist/AnalogStudio/AnalogStudio --smoke

      - name: Package tarball
        run: tar -C dist -czf AnalogStudio-linux-pyinstaller.tar.gz AnalogStudio

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-linux-pyinstaller
          path: AnalogStudio-linux-pyinstaller.tar.gz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Variant 4: Linux Nuitka (standalone, compiled to C) — the protected build.
  # app/ is compiled to native machine code: the dist contains NO app .py/.pyc,
  # so the self-written source cannot be recovered from the install directory
  # (the PyInstaller variants ship app/ as decompilable .pyc). Vendored skill
  # trees stay as non-Python data ngspice reads from disk — see
  # CODE_PROTECTION.md for what this does and does not protect.
  # ───────────────────────────────────────────────────────────────────────────
  linux-nuitka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Restore Nuitka compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        # Linux mirror of the Windows Nuitka build (no --msvc / console flags).
        # --include-package=app forces every app/ submodule into the native
        # binary; the skill asset trees are copied verbatim afterwards (Nuitka
        # refuses .py as data — they are runtime source synced to the workspace).
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --linux-icon=app/resources/icons/app_icon.png \
            --include-package=app \
            --include-module=PySide6.QtSvg \
            --include-module=matplotlib.backends.backend_agg \
            --include-module=matplotlib.backends.backend_qtagg \
            --include-module=scipy.stats \
            --include-module=scipy.signal \
            --nofollow-import-to=optuna \
            --nofollow-import-to=sqlalchemy \
            --nofollow-import-to=greenlet \
            --nofollow-import-to=alembic \
            --nofollow-import-to=mako \
            --nofollow-import-to=colorlog \
            --include-package-data=matplotlib \
            --include-data-dir=app/resources=app_resources \
            --include-data-dir=transistor-models/assets/models/bulk_cmos=bulk_models \
            --include-data-dir=transistor-models/assets/models/finfet=finfet_models \
            --include-data-dir=analoggym=analoggym \
            --include-data-dir=studio_circuits=studio_circuits \
            --output-filename=AnalogStudio.bin \
            --output-dir=build-nuitka \
            app/main.py

      - name: Save Nuitka compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}

      - name: Bundle skill assets + wheel libs
        # app/paths.py looks for <exe dir>/skill/{ngspice_assets,gmoverid_assets}
        # and syncs them to a writable workspace on first launch. The auditwheel
        # *.libs dirs (numpy.libs / scipy.libs / pillow.libs) hold the bundled
        # OpenBLAS/… .so files; Nuitka's scan misses them, so copy them next to
        # the packages AND flatten the .so into the app dir (which is on the
        # runtime search path) — without them `import scipy` fails at startup.
        run: |
          dist=build-nuitka/main.dist
          mkdir -p "$dist/skill"
          cp -r ngspice/assets  "$dist/skill/ngspice_assets"
          cp -r gmoverid/assets "$dist/skill/gmoverid_assets"
          cp -r circuit-skills  "$dist/circuit_skills"
          find "$dist/skill" "$dist/circuit_skills" -type d \
               \( -name __pycache__ -o -name logs -o -name plots \) \
               -prune -exec rm -rf {} + || true
          site=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          for d in "$site"/*.libs; do
            [ -d "$d" ] || continue
            cp -r "$d" "$dist/$(basename "$d")"
            cp "$d"/*.so* "$dist/" 2>/dev/null || true
          done
          # protection guarantee: fail the build if any app/ Python source
          # (or bytecode) leaked into the dist — the whole point of Nuitka here
          leaked=$(find "$dist" -path '*app*' \( -name '*.py' -o -name '*.pyc' \) | wc -l)
          test "$leaked" -eq 0 || { echo "app/ source leaked into dist ($leaked files):";
                                    find "$dist" -path '*app*' \( -name '*.py' -o -name '*.pyc' \); exit 1; }
          mv "$dist" build-nuitka/AnalogStudio

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 180 ./build-nuitka/AnalogStudio/AnalogStudio.bin --smoke

      - name: Package tarball
        run: tar -C build-nuitka -czf AnalogStudio-linux-nuitka.tar.gz AnalogStudio

      - uses: actions/upload-artifact@v4
        with:
          name: AnalogStudio-linux-nuitka
          path: AnalogStudio-linux-nuitka.tar.gz
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Tag builds publish a GitHub Release with all packages attached and
  # the matching CHANGELOG section as the release notes
  # ───────────────────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [pyinstaller, nuitka, linux, linux-nuitka]
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/')
                       && github.ref_name || inputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        # first "## " section = the release being tagged (newest on top)
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Analog Studio ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            artifacts/AnalogStudio-windows-pyinstaller.zip
            artifacts/AnalogStudio-windows-nuitka.zip
            artifacts/AnalogStudio-linux-pyinstaller.tar.gz
            artifacts/AnalogStudio-linux-nuitka.tar.gz
          fail_on_unmatched_files: true
