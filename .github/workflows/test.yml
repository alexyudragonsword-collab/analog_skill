name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Qt runtime libraries
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Run tests (with real ngspice simulations)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest app/tests/ -v

      - name: App smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: timeout 90 python -m app.main --smoke
