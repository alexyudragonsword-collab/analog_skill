name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Rule set and exclusions live in ruff.toml — the vendored skill trees
      # are archived upstream snapshots and are not linted.
      - name: Lint app/ and tools/ (ruff)
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.16,<0.17'      # same bound as requirements-dev.txt
          ruff check .

  pytest:
    # Windows/macOS are here to catch platform bugs in path handling and Qt
    # construction; the ngspice-dependent tests self-skip where the
    # simulator is unavailable (see needs_ngspice in the test modules).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes ~3 min. The cap exists because a test that blocks on a
    # modal dialog does not fail — it waits, and GitHub's own limit is six
    # hours. That happened once; twenty minutes is the cost of the next one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Install ngspice (macOS)
        if: runner.os == 'macOS'
        # non-fatal: without it the simulation tests skip rather than fail,
        # and the rest of the suite still exercises the macOS paths
        run: brew install ngspice || echo 'ngspice unavailable — sim tests will skip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Run tests (with real ngspice simulations)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest app/tests/ -v

      # `timeout` is GNU coreutils: absent on the macOS runner and on
      # Windows, so the 90 s guard is applied from Python instead.
      - name: App smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -c "import subprocess, sys;
          sys.exit(subprocess.run([sys.executable, '-m', 'app.main',
          '--smoke'], timeout=90).returncode)"
